name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11.5+ with native OIDC Trusted Publishing support.
      # Do not pass registry-url here so setup-node does not write an empty _authToken.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm test
      - run: npm publish --provenance --access public
